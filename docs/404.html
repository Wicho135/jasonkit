<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <title>Página no encontrada — JSONKit</title>
    <meta
      name="description"
      content="La página que buscas no existe o se ha movido. Vuelve al inicio de JSONKit para seguir trabajando con tus datos." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        background:
          radial-gradient(700px 420px at 20% 0%, rgba(99, 102, 241, 0.24), transparent 60%),
          radial-gradient(600px 360px at 90% 100%, rgba(56, 189, 248, 0.12), transparent 60%),
          #0f172a;
        color: #e2e8f0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: min(100%, 440px);
        padding: clamp(1.5rem, 5vw, 2.5rem);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 22px;
        background: rgba(15, 23, 42, 0.7);
        box-shadow: 0 30px 80px -40px #020617;
        backdrop-filter: blur(12px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 1.6rem;
        color: #f8fafc;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 2.1rem;
        height: 2.1rem;
        border-radius: 10px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6 52%, #38bdf8);
        box-shadow: 0 10px 28px -12px rgba(99, 102, 241, 0.8);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.78rem;
      }

      .brand span:last-child {
        background: linear-gradient(90deg, #a5b4fc, #67e8f9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
      }

      .code {
        margin: 0;
        background: linear-gradient(135deg, #a5b4fc, #67e8f9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(3.5rem, 14vw, 5rem);
        font-weight: 700;
        letter-spacing: -0.06em;
        line-height: 1;
      }

      h1 {
        margin: 0.8rem 0 0.5rem;
        color: #f8fafc;
        font-size: clamp(1.25rem, 4vw, 1.5rem);
        letter-spacing: -0.025em;
      }

      p {
        margin: 0 auto 1.6rem;
        max-width: 34ch;
        color: #94a3b8;
        font-size: 0.92rem;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0.65rem 1.1rem;
        border-radius: 11px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed 52%, #2563eb);
        box-shadow: 0 14px 36px -14px rgba(99, 102, 241, 0.8);
        color: #fff;
        font-size: 0.86rem;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.16s ease, filter 0.16s ease;
      }

      .button:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }

      :focus-visible {
        outline: 2px solid #22d3ee;
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        .button {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="card">
      <a class="brand" href="./" aria-label="JSONKit — Inicio">
        <span class="brand-mark" aria-hidden="true">{}</span>
        <span>JSONKit</span>
      </a>

      <p class="code" aria-hidden="true">404</p>
      <h1>Página no encontrada</h1>
      <p>
        La página que buscas no existe o se ha movido. Vuelve al inicio para
        seguir trabajando con tu JSON.
      </p>
      <a class="button" href="./">Volver al inicio</a>
    </main>
  </body>
</html>
